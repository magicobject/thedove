<footer class="site">
  <div class="wrap">
    <div class="safeguard-strip" role="region" aria-label="Safeguarding notice">
      <p>Concerned about a child or adult's safety? Call <strong>999</strong> in an emergency.</p>
      <a class="pill-link" href="/safeguarding">Safeguarding information &amp; contacts</a>
    </div>
    <div class="foot-grid">
      <div>
        <p class="foot-heading">{{ORG_NAME}}</p>
        <p>{{VENUE_LINE}}</p>
        <div class="badge-strip">
          <span class="badge">{{OPENING_STATUS}}</span>
        </div>
      </div>
      <div>
        <p class="foot-heading">Get in touch</p>
        <p>{{EMAIL_LINK}}</p>
        <p>Contact: {{CONTACT_NAME}}</p>
      </div>
    </div>
    <div class="fine">
      &copy; <span id="year"></span> {{ORG_NAME}}. Site by <a href="{{MEDIAWRIGHT_HREF}}">{{MEDIAWRIGHT_LABEL}}</a>.
    </div>
  </div>
</footer>
