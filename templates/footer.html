<footer class="site">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <p class="foot-heading">{{ORG_NAME}}</p>
        <p>{{VENUE_LINE}}</p>
        <div class="badge-strip">
          <span class="badge">{{OPENING_STATUS}}</span>
        </div>
      </div>
      <div>
        <p class="foot-heading">Get in touch</p>
        <p>{{EMAIL_LINK}}</p>
        <p>Contact: {{CONTACT_NAME}}</p>
      </div>
    </div>
    <div class="fine">
      <span>&copy; <span id="year"></span> {{ORG_NAME}}. Site by <a href="{{MEDIAWRIGHT_HREF}}">{{MEDIAWRIGHT_LABEL}}</a>.</span>
      <span class="build-number">Build {{BUILD_NUMBER}}</span>
    </div>
  </div>
</footer>
